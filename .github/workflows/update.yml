# .github/workflows/update.yml
#
# Runs every 5 minutes:
#   1. Fetches latest MISO LMP data
#   2. Regenerates static site charts
#   3. Commits data + pushes updated docs/ to GitHub Pages
#
# Prerequisites:
#   - GitHub Pages enabled on the repo, source set to "docs/" on main branch
#   - A Personal Access Token (PAT) with repo write scope stored as
#     secret GH_PAT (Settings → Secrets → Actions → New repository secret)

name: Collect & Deploy

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:          # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # must finish before next 5-min trigger

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect latest LMP data
        run: python collector/fetch.py

      - name: Generate static charts
        run: python site/generate.py
        # This script reads from data/lmp/ and writes HTML to docs/

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
